description: >-
  Cboe sells the LiveVol All Access API through Cboe DataShop as points-based
  subscription tiers. Each request consumes points against a daily (trial) or
  monthly (paid) allowance; paid tiers add per-point overage. SIP subscriptions
  (OPRA, CTA/UTP, CSMi) are optional add-ons required for certain live/delayed
  professional-level market data. Tiers 1-2 are referenced in the API docs but
  their pricing is not published on the public product page.
sources:
  - https://datashop.cboe.com/cboe-all-access-api
plans:
  - id: cboe-all-access-trial
    name: All Access API — Free Trial
    type: trial
    description: 14-day free trial; credit card authorization required but not charged; no overage available.
    entries:
      - label: Points allowance
        name: points_daily
        type: metered
        metric: points
        limit: 500
        timeFrame: day
        price: $0/month
  - id: cboe-all-access-tier-3
    name: All Access API — Tier 3
    type: subscription
    entries:
