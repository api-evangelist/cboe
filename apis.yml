apis:
  - aid: cboe:cboe-livevol-all-access-api
    name: Cboe LiveVol All Access API
    tags:
      - Options
      - Equities
      - Market Data
      - Volatility
      - Analytics
      - Scanners
      - Earnings
    humanURL: https://api.livevol.com/v1/docs/
    baseURL: https://api.livevol.com/v1
    description: The Cboe LiveVol All Access API is a REST API suite offering
      quote and trade details for equities and options via live, delayed, and
      historical endpoints. Endpoint groups cover Market at a Glance (option
      trades, quotes, market notifications), Time and Sales (trades, quotes,
      market depth, option trades with Greeks), Events (earnings data),
      Analytics (trade review), Reference (symbols, expirations, exchanges,
      currencies), and Scans and Alerts (custom scanners, trade optimizer).
      Access is OAuth 2.0 via id.livevol.com with points-based usage tiers
      sold through Cboe DataShop.
    properties:
      - type: Documentation
        url: https://api.livevol.com/v1/docs/
      - type: APIReference
        url: https://api.livevol.com/v1/docs/Help
      - type: Authentication
        url: https://api.livevol.com/v1/docs/Home/Authentication
      - type: Examples
        url: https://api.livevol.com/v1/docs/Home/Examples
      - type: ErrorCodes
        url: https://api.livevol.com/v1/docs/Home/ResponseCodes
      - type: Pricing
        url: https://datashop.cboe.com/cboe-all-access-api
  - aid: cboe:cboe-delayed-quotes-api
    name: Cboe Delayed Quotes API
    tags:
      - Quotes
      - Options
      - Indices
      - Market Data
    humanURL: https://www.cboe.com/delayed_quotes/
    baseURL: https://cdn.cboe.com/api/global
    description: Public, unauthenticated JSON endpoints served from cdn.cboe.com
      that back the delayed-quote pages on cboe.com. Provide delayed quotes and
      full option chains for equities and Cboe indices (for example
      /delayed_quotes/quotes/_SPX.json and /delayed_quotes/options/_SPX.json),
      including price, volume, implied volatility, and Greeks fields. Not
      formally documented as a supported product; captured here as an observed
      public surface.
    properties:
      - type: Documentation
        url: https://www.cboe.com/delayed_quotes/
