description: 'Cboe Global Markets is one of the world''s largest exchange holding
  companies, operating options, futures, equities, and FX markets including the
  Cboe Options Exchange, home of the VIX Index and SPX options. Cboe offers market
  data programmatically through the Cboe DataShop platform and the LiveVol All
  Access API — a REST API suite covering real-time, delayed, and historical
  options and equities quotes and trades, Greeks and implied volatility
  analytics, earnings events, custom market scanners, and trade review —
  secured with OAuth 2.0 via the LiveVol identity service, plus free public
  delayed-quote JSON endpoints that back cboe.com quote pages.'
