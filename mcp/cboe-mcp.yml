- name: run_custom_scanner
  description: Run a custom market scan (Scans and Alerts)
  source_operation: POST /allaccess/scans-and-alerts/custom-scanner
  docs: https://api.livevol.com/v1/docs/Help
- name: review_trade
  description: Trade review — parity check, implied volatility, Greeks, execution-quality benchmarks (Analytics)
  source_operation: POST /allaccess/analytics/trade-review
  docs: https://api.livevol.com/v1/docs/Help
- name: list_exchanges
  description: Reference list of exchanges
  source_operation: GET /allaccess/reference/exchanges
  docs: https://api.livevol.com/v1/docs/Help/Api/GET-allaccess-reference-exchanges
- name: list_symbols
  description: Reference list of symbols
  source_operation: GET /market/symbols
